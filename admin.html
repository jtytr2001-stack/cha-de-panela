<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — Victor & Mariana</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f2;color:#111;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{font:34px Georgia,serif}.back{padding:10px 14px;background:#111;color:#fff;text-decoration:none;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.box{background:#fff;border:1px solid #ddd;padding:22px}.box h2{font:23px Georgia,serif;margin-top:0}.full{grid-column:1/-1}.field{margin:12px 0}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#666;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #ccc}.btn{background:#111;color:#fff;border:0;padding:12px 16px;cursor:pointer;margin:4px 4px 4px 0}.danger{background:#777}.item{display:flex;gap:8px;margin:8px 0}.item input{flex:1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;gap:10px}}
</style></head><body><div class="wrap">
<div class="top"><h1>Painel dos noivos</h1><a class="back" href="index.html">Ver site</a></div>
<div class="grid">
<div class="box"><h2>Resumo</h2><p>Confirmações: <b id="nr">0</b></p><p>Presentes reservados: <b id="ng">0</b></p><p>Créditos registrados: <b id="nc">0</b></p><button class="btn" onclick="exportData()">Exportar dados</button><button class="btn danger" onclick="clearData()">Limpar respostas</button></div>
<div class="box"><h2>Evento</h2><div class="field"><label>Data</label><input id="date"></div><div class="field"><label>Horário</label><input id="time"></div><div class="field"><label>Local</label><input id="place"></div><button class="btn" onclick="saveEvent()">Salvar</button></div>
<div class="box"><h2>Créditos</h2><div id="creditEdit"></div><button class="btn" onclick="addCredit()">+ Valor</button><button class="btn" onclick="saveCredits()">Salvar</button></div>
<div class="box full"><h2>Presentes físicos</h2><div id="giftEdit"></div><button class="btn" onclick="addGift()">+ Presente</button><button class="btn" onclick="saveGifts()">Salvar lista</button></div>
<div class="box full"><h2>Confirmações de presença</h2><div id="rsvpTable"></div></div>
<div class="box full"><h2>Créditos escolhidos</h2><div id="creditTable"></div></div>
</div></div>
<script>
const def={date:"05/12",time:"14h",place:"Esplendor Garden",gifts:[["Jogo de panelas","R$ 450"],["Air Fryer","R$ 600"],["Jogo de copos","R$ 100"],["Liquidificador","R$ 250"],["Jogo de pratos","R$ 300"],["Conjunto de talheres","R$ 180"]],credits:[50,100,150,200,300,500]};
let d=JSON.parse(localStorage.getItem("chaData")||"null")||def;
function render(){date.value=d.date;time.value=d.time;place.value=d.place;giftEdit.innerHTML=d.gifts.map((g,i)=>`<div class="item"><input id="gn${i}" value="${g[0]}"><input id="gv${i}" value="${g[1]}"></div>`).join("");creditEdit.innerHTML=d.credits.map((v,i)=>`<div class="item"><input id="cv${i}" type="number" value="${v}"></div>`).join("");let r=JSON.parse(localStorage.getItem("rsvps")||"[]");nr.textContent=r.length;ng.textContent=(JSON.parse(localStorage.getItem("reservas")||"[]")).length;let c=JSON.parse(localStorage.getItem("creditos")||"[]");nc.textContent=c.length;rsvpTable.innerHTML=r.length?`<table class="table"><tr><th>Nome</th><th>Presença</th><th>Acompanhantes</th><th>WhatsApp</th></tr>${r.map(x=>`<tr><td>${x.nome}</td><td>${x.presenca}</td><td>${x.acompanhantes}</td><td>${x.telefone||""}</td></tr>`).join("")}</table>`:"Nenhuma confirmação ainda.";creditTable.innerHTML=c.length?`<table class="table"><tr><th>Nome</th><th>Valor</th><th>Data</th></tr>${c.map(x=>`<tr><td>${x.nome}</td><td>R$ ${x.valor}</td><td>${x.data}</td></tr>`).join("")}</table>`:"Nenhuma contribuição registrada."}
function saveEvent(){d.date=date.value;d.time=time.value;d.place=place.value;save();alert("Informações salvas.")}
function saveGifts(){d.gifts=d.gifts.map((_,i)=>[document.getElementById("gn"+i).value,document.getElementById("gv"+i).value]);save();alert("Lista salva.")}
function saveCredits(){d.credits=d.credits.map((_,i)=>Number(document.getElementById("cv"+i).value)).filter(Boolean);save();alert("Valores salvos.")}
function addGift(){d.gifts.push(["Novo presente","R$ 0"]);render()}function addCredit(){d.credits.push(0);render()}function save(){localStorage.setItem("chaData",JSON.stringify(d));render()}
function exportData(){let out={config:d,rsvps:JSON.parse(localStorage.getItem("rsvps")||"[]"),reservas:JSON.parse(localStorage.getItem("reservas")||"[]"),creditos:JSON.parse(localStorage.getItem("creditos")||"[]")};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));a.download="dados-cha-victor-mariana.json";a.click()}
function clearData(){if(confirm("Apagar todas as confirmações, reservas e créditos deste navegador?")){localStorage.removeItem("rsvps");localStorage.removeItem("reservas");localStorage.removeItem("creditos");render()}}
render();
</script></body></html>
